<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIPreneur News · Control Center</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">AN</span>
          <div class="brand-text">
            <strong id="app-title">AIPreneur News</strong>
            <span class="subtitle">@aipreneur.news_ · News Automation</span>
          </div>
        </div>
        <span class="badge badge-muted">Control Center</span>
      </header>

      <main class="stack">
        <section class="panel">
          <div class="panel-head">
            <h2>Jalankan Pipeline</h2>
            <p class="panel-hint">
              Kosongkan tanggal untuk memakai hari ini (zona Asia/Jakarta).
            </p>
          </div>
          <form id="run-form" class="form-row">
            <label class="field">
              <span class="field-label">Tanggal run</span>
              <input type="text" id="runDate" placeholder="YYYY-MM-DD" inputmode="numeric" />
            </label>
            <label class="field field-check">
              <input type="checkbox" id="skipYoutube" checked />
              <span>Skip YouTube</span>
            </label>
            <label class="field field-check">
              <input type="checkbox" id="skipInstagram" checked />
              <span>Skip Instagram</span>
            </label>
            <button type="submit" class="btn-primary">Jalankan</button>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Status Task</h2>
          </div>
          <pre id="taskResult" class="task-log">Belum ada task.</pre>
        </section>

        <section class="panel">
          <div class="panel-head panel-head-row">
            <div>
              <h2>Output Terakhir</h2>
              <p class="panel-hint">3 hasil terbaru · klik kartu untuk detail</p>
            </div>
            <span id="outputCount" class="badge badge-muted"></span>
          </div>
          <div id="outputList" class="output-grid"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
